
name: Register Breeze Helper Announce Command

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register-command:
    runs-on: ubuntu-latest

    steps:
      - name: Register /announce in Breezes SMP
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APP_ID: "1560570227803029565"
          GUILD_ID: "1560558411022737540"
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.DISCORD_BOT_TOKEN;
          const appId = process.env.APP_ID;
          const guildId = process.env.GUILD_ID;

          if (!token) {
            throw new Error("Missing DISCORD_BOT_TOKEN GitHub secret.");
          }

          const command = {
            name: "announce",
            description: "Preview and publish an announcement",
            type: 1,
            default_member_permissions: "8",
            options: [
              {
                type: 3,
                name: "title",
                description: "Announcement title",
                required: true,
                max_length: 256
              },
              {
                type: 3,
                name: "message",
                description: "Announcement message",
                required: true,
                max_length: 4000
              },
              {
                type: 7,
                name: "channel",
                description: "Channel where the announcement will be posted",
                required: true,
                channel_types: [0, 5]
              },
              {
                type: 8,
                name: "role",
                description: "Optional role to mention",
                required: false
              }
            ]
          };

          const response = await fetch(
            `https://discord.com/api/v10/applications/${appId}/guilds/${guildId}/commands`,
            {
              method: "POST",
              headers: {
                Authorization: `Bot ${token}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify(command)
            }
          );

          const result = await response.text();

          if (!response.ok) {
            throw new Error(
              `Discord returned ${response.status}: ${result}`
            );
          }

          console.log("Successfully registered /announce.");
          console.log(result);
          NODE
