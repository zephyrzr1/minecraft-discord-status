
name: Breezes SMP Server Information

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-discord-status
  cancel-in-progress: false

jobs:
  update-info:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update server information and preserve rules
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: "1560574790018801665"
          RULES_CHANNEL_ID: "1560566171059884093"
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const token = process.env.DISCORD_BOT_TOKEN;
          const channelId = process.env.CHANNEL_ID;
          const rulesChannelId = process.env.RULES_CHANNEL_ID;

          if (!token) {
            throw new Error('Missing DISCORD_BOT_TOKEN secret.');
          }

          const discord = async (method, path, body) => {
            const response = await fetch(
              `https://discord.com/api/v10${path}`,
              {
                method,
                headers: {
                  Authorization: `Bot ${token}`,
                  'Content-Type': 'application/json'
                },
                ...(body ? { body: JSON.stringify(body) } : {})
              }
            );

            if (!response.ok) {
              const error = new Error(
                `Discord API error: ${response.status} ${await response.text()}`
              );
              error.status = response.status;
              throw error;
            }

            return response.json();
          };

          // Static server information. No server-status polling.
          const infoEmbed = {
            title: '🌍 Breezes SMP | Server Information',
            color: 0xA18AF2,
            description: [
              '**☕ Java Edition**',
              '`breezes.play.hosting`',
              '',
              '**🌐 Direct IP**',
              '`216.75.75.131`',
              '',
              '**🎮 Version**',
              'Minecraft Java 1.21.11 · Fabric',
              '',
              '**📱 Bedrock Crossplay**',
              'Supported via Geyser and Floodgate.'
            ].join('\n'),
            fields: [
              {
                name: '🏗️ World Generation',
                value: [
                  '• Bigger Better End Cities — `1.1.3`',
                  "• ChoiceTheorem's Overhauled Village — `3.6.2a`",
                  "• Moog's Mineshafts Reimagined — `1.1.0`",
                  "• Moog's Missing Villages — `2.2.0`",
                  "• Moog's Nether Structures — `3.1.1`",
                  "• Moog's Soaring Structures — `2.2.0`",
                  "• Moog's Temples Reimagined — `2.0.4`",
                  "• Moog's Voyager Structures — `5.1.3`",
                  "• Moog's Structure Lib — `3.4.2`",
                  '• Lithostitched — `1.7.2`'
                ].join('\n'),
                inline: false
              },
              {
                name: '⚡ Performance & Networking',
                value: [
                  '• FerriteCore — `8.2.0`',
                  '• Krypton — `0.2.10`',
                  '• Lithium — `0.21.4`',
                  '• NoisiumForked — `2.8.3`',
                  '• ScalableLux — `0.3.0-alpha.0.3`',
                  '• ServerCore — `1.5.15`'
                ].join('\n'),
                inline: false
              },
              {
                name: '🧰 Gameplay & Utility',
                value: [
                  '• AntiXray — `1.4.14`',
                  '• AppleSkin — `3.0.8`',
                  '• ReplayMod — `2.6.27`',
                  '• ShibaGrace — `1.0.2`'
                ].join('\n'),
                inline: false
              },
              {
                name: '🎙️ Voice Chat & Community',
                value: [
                  '• Simple Voice Chat — `2.6.24`',
                  '• Simple Voice Chat Discord Bridge — `3.2.1`',
                  '• Simple Voice Chat Enhanced Groups — `1.7.1`',
                  '• Discord Statusbot — `24.0`'
                ].join('\n'),
                inline: false
              },
              {
                name: '🔧 Libraries & Crossplay',
                value: [
                  '• Fabric API — `0.141.6`',
                  '• Cloth Config API — `21.11.153`',
                  '• Cristel Lib — `3.1.7`',
                  '• Floodgate — `2.2.6-b60`',
                  '• Geyser — `2.9.6-b1133`'
                ].join('\n'),
                inline: false
              },
              {
                name: 'ℹ️ Checking Server Status',
                value: [
                  'This embed does not display live server status or player counts.',
                  '',
                  'Check **Breeze Helper’s profile/status** to see whether the server is online and who is currently playing.'
                ].join('\n'),
                inline: false
              }
            ],
            footer: {
              text: 'Breezes SMP.'
            }
          };

          // Update the existing information message, or create it
          // if its saved message no longer exists.
          let messageId = '';

          try {
            messageId = (
              await readFile('message_id.txt', 'utf8')
            ).trim();
          } catch {}

          let infoMessage;

          if (messageId) {
            try {
              infoMessage = await discord(
                'PATCH',
                `/channels/${channelId}/messages/${messageId}`,
                { embeds: [infoEmbed] }
              );

              console.log(
                'Updated server information message:',
                infoMessage.id
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              console.log(
                'Saved information message was deleted; creating a replacement.'
              );
            }
          }

          if (!infoMessage) {
            infoMessage = await discord(
              'POST',
              `/channels/${channelId}/messages`,
              { embeds: [infoEmbed] }
            );

            await writeFile(
              'message_id.txt',
              infoMessage.id + '\n'
            );

            console.log(
              'Created server information message:',
              infoMessage.id
            );
          }

          // Preserve the existing rules embed.
          // Only create it if no rules message ID is saved.
          let rulesMessageId = '';

          try {
            rulesMessageId = (
              await readFile('rules_message_id.txt', 'utf8')
            ).trim();
          } catch {}

          if (!rulesMessageId) {
            const rulesEmbed = {
              title: 'Breezes SMP | Server Rules',
              color: 0xA18AF2,
              description: [
                '**📜 1. Be Honourable**',
                'No harassment, hate speech, doxxing, threats, or spam.',
                '',
                '**⚔️ 2. Be Absurd**',
                'PvP, raiding, stealing, and griefing are allowed.',
                '',
                '**🛠️ 3. No Cheating**',
                'No hacked clients, X-ray, combat cheats, or unfair exploits.',
                '',
                '━━━━━━━━━━━━━━━━━━━━',
                'By playing on Breezes SMP, you agree to these rules.'
              ].join('\n'),
              footer: {
                text: 'Breezes SMP.'
              }
            };

            const rulesMessage = await discord(
              'POST',
              `/channels/${rulesChannelId}/messages`,
              { embeds: [rulesEmbed] }
            );

            await writeFile(
              'rules_message_id.txt',
              rulesMessage.id + '\n'
            );

            console.log(
              'Created rules message:',
              rulesMessage.id
            );
          } else {
            console.log(
              'Rules message ID already saved; skipping creation.'
            );
          }
          NODE

      - name: Save message IDs for future runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          git add message_id.txt rules_message_id.txt

          if ! git diff --cached --quiet; then
            git commit -m "Save Discord message IDs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
