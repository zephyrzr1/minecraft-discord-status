
name: Minecraft Discord Status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-discord-status
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Discord status and create rules
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: "1560574790018801665"
          RULES_CHANNEL_ID: "1560566171059884093"
          SERVER_ADDRESS: "breezes.play.hosting:25811"
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const token = process.env.DISCORD_BOT_TOKEN;
          const channelId = process.env.CHANNEL_ID;
          const rulesChannelId = process.env.RULES_CHANNEL_ID;
          const address = process.env.SERVER_ADDRESS;

          if (!token) {
            throw new Error('Missing DISCORD_BOT_TOKEN secret.');
          }

          const discord = async (method, path, body) => {
            const response = await fetch(
              `https://discord.com/api/v10${path}`,
              {
                method,
                headers: {
                  Authorization: `Bot ${token}`,
                  'Content-Type': 'application/json'
                },
                ...(body ? { body: JSON.stringify(body) } : {})
              }
            );

            if (!response.ok) {
              const error = new Error(
                `Discord API error: ${response.status} ${await response.text()}`
              );
              error.status = response.status;
              throw error;
            }

            return response.json();
          };

          // Check the Minecraft server.
          let online = false;
          let checkFailed = false;
          let players = 0;
          let maxPlayers = '?';

          try {
            const response = await fetch(
              `https://api.mcsrvstat.us/3/${address}`,
              { signal: AbortSignal.timeout(15000) }
            );

            if (!response.ok) {
              throw new Error(
                `Status service returned ${response.status}`
              );
            }

            const data = await response.json();
            online = data.online === true;

            if (online) {
              players = data.players?.online ?? 0;
              maxPlayers = data.players?.max ?? '?';
            }
          } catch (error) {
            checkFailed = true;
            console.error(
              'Could not check Minecraft server:',
              error.message
            );
          }

          const status = checkFailed
            ? '⚠️ Status check unavailable'
            : online
              ? '🟢 Online'
              : '🔴 Offline';

          const statusEmbed = {
            title: '🌍 Breezes Minecraft Server',
            color: checkFailed
              ? 0xF1C40F
              : online
                ? 0x2ECC71
                : 0xE74C3C,
            description: `**Status:** ${status}`,
            fields: [
              {
                name: '👥 Players',
                value: checkFailed
                  ? 'Unknown'
                  : `${players}/${maxPlayers}`,
                inline: true
              },
              {
                name: '☕ Java Edition',
                value: '1.21.11',
                inline: true
              },
              {
                name: '📱 Bedrock Crossplay',
                value: 'Supported via Geyser',
                inline: true
              },
              {
                name: '🔗 Server Address',
                value: `\`${address}\``,
                inline: false
              }
            ],
            footer: {
              text: 'Automatically updated every 5 minutes'
            },
            timestamp: new Date().toISOString()
          };

          // Update the status message, or replace it if it was deleted.
          let messageId = '';

          try {
            messageId = (
              await readFile('message_id.txt', 'utf8')
            ).trim();
          } catch {}

          let statusMessage;

          if (messageId) {
            try {
              statusMessage = await discord(
                'PATCH',
                `/channels/${channelId}/messages/${messageId}`,
                { embeds: [statusEmbed] }
              );

              console.log(
                'Updated status message:',
                statusMessage.id
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              console.log(
                'Old status message not found; creating a replacement.'
              );
            }
          }

          if (!statusMessage) {
            statusMessage = await discord(
              'POST',
              `/channels/${channelId}/messages`,
              { embeds: [statusEmbed] }
            );

            await writeFile(
              'message_id.txt',
              statusMessage.id + '\n'
            );

            console.log(
              'Created status message:',
              statusMessage.id
            );
          }

          // Create the rules embed if no rules message ID is saved.
          let rulesMessageId = '';

          try {
            rulesMessageId = (
              await readFile('rules_message_id.txt', 'utf8')
            ).trim();
          } catch {}

          if (!rulesMessageId) {
            const rulesEmbed = {
              title: 'Breezes SMP | Server Rules',
              color: 0xA18AF2,
              description: [
                '**📜 1. Be Honourable**',
                'No harassment, hate speech, doxxing, threats, or spam.',
                '',
                '**⚔️ 2. Be Absurd**',
                'PvP, raiding, stealing, and griefing are allowed.',
                '',
                '**🛠️ 3. No Cheating**',
                'No hacked clients, X-ray, combat cheats, or unfair exploits.',
                '',
                '━━━━━━━━━━━━━━━━━━━━',
                'By playing on Breezes SMP, you agree to these rules.'
              ].join('\n'),
              footer: {
                text: 'Breezes SMP.'
              }
            };

            const rulesMessage = await discord(
              'POST',
              `/channels/${rulesChannelId}/messages`,
              { embeds: [rulesEmbed] }
            );

            await writeFile(
              'rules_message_id.txt',
              rulesMessage.id + '\n'
            );

            console.log(
              'Created rules message:',
              rulesMessage.id
            );
          } else {
            console.log(
              'Rules message ID already saved; skipping creation.'
            );
          }
          NODE

      - name: Save message IDs for future runs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add message_id.txt rules_message_id.txt

          if ! git diff --cached --quiet; then
            git commit -m "Save Discord message IDs"

            git pull --rebase origin main

            git push origin HEAD:main
          fi
